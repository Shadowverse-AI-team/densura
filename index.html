<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self';" />
  <title>デンスラ算 - シャドバWB計算ツール</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>デンスラ算</h1>
      <p class="subtitle">x + y + z = n となる組み合わせの確率計算</p>
    </header>

    <section class="input-section">
      <label for="n-input">n の値</label>
      <input id="n-input" type="number" min="0" max="100" value="15" />
      <span id="total-info"></span>
    </section>

    <div class="tabs" role="tablist">
      <button class="tab" data-tab="all" role="tab" aria-selected="false" aria-controls="tab-all">全パターンの確率</button>
      <button class="tab active" data-tab="cond" role="tab" aria-selected="true" aria-controls="tab-cond">条件付き確率</button>
    </div>

    <!-- 全パターンタブ -->
    <section id="tab-all" class="tab-content hidden" role="tabpanel">
      <div id="all-result" aria-live="polite"></div>
    </section>

    <!-- 条件付き確率タブ -->
    <section id="tab-cond" class="tab-content" role="tabpanel">
      <p class="hint">数値を入力するとその条件が有効になります（すべて AND 条件）。チェックを外すとその条件は無視されます。以上・以下の両方を使うと範囲指定になります。</p>
      <div class="cond-row">
        <span class="cond-var">x</span>
        <span class="cond-bound">
          <input type="checkbox" id="chk-x-min" /><label for="chk-x-min">≥</label>
          <input type="number" id="min-x" class="cond-val" min="0" value="0" aria-label="x の下限" />
        </span>
        <span class="cond-bound">
          <input type="checkbox" id="chk-x-max" /><label for="chk-x-max">≤</label>
          <input type="number" id="max-x" class="cond-val" min="0" value="0" aria-label="x の上限" />
        </span>
      </div>
      <div class="cond-row">
        <span class="cond-var">y</span>
        <span class="cond-bound">
          <input type="checkbox" id="chk-y-min" /><label for="chk-y-min">≥</label>
          <input type="number" id="min-y" class="cond-val" min="0" value="0" aria-label="y の下限" />
        </span>
        <span class="cond-bound">
          <input type="checkbox" id="chk-y-max" /><label for="chk-y-max">≤</label>
          <input type="number" id="max-y" class="cond-val" min="0" value="0" aria-label="y の上限" />
        </span>
      </div>
      <div class="cond-row">
        <span class="cond-var">z</span>
        <span class="cond-bound">
          <input type="checkbox" id="chk-z-min" /><label for="chk-z-min">≥</label>
          <input type="number" id="min-z" class="cond-val" min="0" value="0" aria-label="z の下限" />
        </span>
        <span class="cond-bound">
          <input type="checkbox" id="chk-z-max" /><label for="chk-z-max">≤</label>
          <input type="number" id="max-z" class="cond-val" min="0" value="0" aria-label="z の上限" />
        </span>
      </div>
      <div id="cond-result" class="cond-result" aria-live="polite"></div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
